 let rows='';for(let k=0;k<e[2];k++){const s=dd[k];rows+=s?`<div class="set done"><b>Série ${k+1}</b>✓ ${s.kg?s.kg+' kg × ':''}${s.rp}</div>`:k===dd.length?`<div class="set"><b>Série ${k+1}</b>${e[6]?`<span class="mu">${e[3]}</span><button class="p" data-a="timed">Iniciar cronômetro</button>`:`<input id="kg" type="number" step="2.5" inputmode="decimal" placeholder="kg" value="${ld.kg}"><input id="rp" value="${esc(ld.rp)}"><button class="p" data-a="ok">Concluir série</button>`}</div>`:`<div class="set mu"><b>Série ${k+1}</b>${e[3]}</div>`}
 if(T&&T.t==='s'&&false){}
 const col=(t,f)=>`<div class="col"><h3>${t}</h3>`+ex.map((x,i)=>[x,i,(c.prog[i]||[]).length]).filter(([x,i,n])=>f(n,x[2])).map(([x,i,n])=>`<div class="rw"><button class="card ${i==sel?'on':''}" data-a="sel" data-i="${i}"><span>${esc(x[0])}</span><span class="mu">${n}/${x[2]}</span></button>${ed?`<button data-a="mv" data-i="${i}" data-s="-1">↑</button><button data-a="mv" data-i="${i}" data-s="1">↓</button><button data-a="del" data-i="${i}">✕</button>`:''}</div>`).join('')+'</div>';
 $('#app').innerHTML=`<div class="sess">${run?`<div><div class="clk" id="clk"></div><div class="mu">restante de ${S.min} min · <span id="el"></span> decorridos</div></div>`:`<button class="p" data-a="start">Iniciar treino (${S.min} min)</button>`}<div class="bp"><i style="width:${dn/tot*100}%"></i></div><span class="mu">${dn}/${tot} séries · planejado ≈ ${est(D)} min</span><span class="mu" style="flex-basis:100%;font-size:14px">Controle Bluetooth: Enter, Espaço ou PgDn = concluir série · PgUp ou ← = pausar/retomar · 1/2/3 = +10/20/30 s · R = repetir série. Voz: “descanso”, “mais dez/vinte/trinta”, “repetir série”, “pausar”, “continuar”</span><button class="p" data-a="tog">⏯ Iniciar / pausar</button>${run?'<button data-a="finish">Finalizar</button>':''}</div>
 <main><div class="pn"><svg viewBox="0 0 200 135"><g id="fig"></g></svg>${ed?editForm(e):`<h2>${esc(e[0])}</h2><p class="mu">${e[2]} × ${e[3]}${e[4]?' · descanso '+e[4]+' s':''}. ${esc(e[5])}</p>`}${T?`<div class="tm ${T.t==='s'?'':''}" id="tmb"><strong id="tm"></strong><span>${T.t==='s'?'Série em andamento':'Descanso'}</span>${T.t==='r'?'<button data-a="mais" data-s="10">+10 s</button><button data-a="mais" data-s="20">+20 s</button><button data-a="mais" data-s="30">+30 s</button>':''}<button data-a="tog">⏯</button><button data-a="skip">Pular</button></div>`:''}${rows}</div>
 <div>${col('A fazer',(n)=>n===0)}${col('Em andamento',(n,t)=>n>0&&n<t)}${col('Feito',(n,t)=>n>=t)}${ed?`<div class="pn"><div class="ef"><label>Dia (aba)<input data-f="dl" value="${esc(D.d)}"></label><label>Título do dia<input data-f="dn" value="${esc(D.n)}"></label><label>Duração do treino (min)<input type="number" data-f="min" value="${S.min}"></label><label>Avisos por voz<select data-f="voz"><option value="1"${S.voz!==false?' selected':''}>Ligados</option><option value="0"${S.voz===false?' selected':''}>Desligados</option></select></label><label>Sensibilidade do gesto (10–120; menor = mais sensível)<input type="number" data-f="sens" value="${S.sens}"></label></div><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="p" data-a="addx">+ Exercício</button><button data-a="rst">Restaurar padrão</button></p></div>`:''}</div></main>`;
}
function tick(){const c=S.cur;const n=Date.now();
 if(c&&c.start&&$('#clk')){const e2=el(c),r=S.min*60-e2;$('#clk').textContent=(r<0?'+':'')+fmt(Math.abs(r));$('#clk').className='clk'+(r<600?' w':'');$('#el').textContent=fmt(e2)+(c.pz?' · PAUSADO':'')}
 if(T){const r=(T.end-(T.p||n))/1000,t=$('#tm');if(T.t==='r'&&!T.w&&!T.p&&T.tot>10&&r<=10&&r>0){T.w=1;say('Prepare-se. A próxima série começa em 10 segundos.')}if(r<=0&&!T.done&&!T.p){T.done=1;beep();if(T.t==='s'){const e=DAYS[day].ex[sel];T=null;add(0,e[6]>=60?e[6]/60+' min':e[6]+' s');return}$('#tmb')&&$('#tmb').classList.add('o');const cc=S.cur,xx=DAYS[day].ex[sel];say('Hora da próxima série. '+xx[0]+', série '+(((cc&&cc.prog[sel])||[]).length+1)+' de '+xx[2])}
 if(t)t.textContent=(T.p?'⏸ ':'')+(r>0?fmt(r):'+'+fmt(-r))}}
setInterval(tick,250);
function frame(t){const f=$('#fig');if(f&&view==='t'){const p=P[DAYS[day].ex[sel][1]],k=(1-Math.cos(2*Math.PI*t/2600))/2,q=p[0].map((v,i)=>+(v+(p[1][i]-v)*k).toFixed(1)),[hx,hy,sx,sy,ex,ey,wx,wy,px,py,kx,ky,ax,ay]=q;
 f.innerHTML=`<line x1="10" y1="125" x2="190" y2="125" class="e"/><g class="e">${EN[p[2]]||''}${p[2]==='s'&&DAYS[day].ex[sel][1]==='pulldown'?`<path d="M84 0L${wx} ${wy}"/>`:''}</g><g stroke-width="5"><path d="M${sx} ${sy}L${px} ${py}L${kx} ${ky}L${ax} ${ay}l10 1M${sx} ${sy}L${ex} ${ey}L${wx} ${wy}"/></g><circle class="h" cx="${hx}" cy="${hy}" r="8"/>${p[3]?`<circle class="q" cx="${wx}" cy="${wy}" r="6"/>`:''}`}
 requestAnimationFrame(frame)}
const G={on:0,base:null,n:0,arm:1,rel:0};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2000)};
function tog(){const c=cur(),n=Date.now();
 if(!c.start){c.start=n;toast('Treino iniciado')}
 else if(T){if(T.p){T.end+=n-T.p;T.p=0;toast('Cronômetro retomado')}else{T.p=n;toast('Cronômetro pausado')}}
 else if(c.pz){c.pt=(c.pt||0)+n-c.pz;c.pz=0;toast('Treino retomado')}else{c.pz=n;toast('Treino pausado')}
 save();render()}
async function wl(){try{G.wl=await navigator.wakeLock.request('screen')}catch(e){}}
async function gOn(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:160,height:120},audio:false});G.s=s;const v=$('#cam');v.srcObject=s;v.style.display='block';await v.play();G.on=1;G.base=null;G.n=0;G.arm=1;wl();G.h=setInterval(gLoop,100);toast('Gestos ativos: cubra a câmera com a palma da mão')}catch(e){alert('A câmera está bloqueada nesta página. Para usar o gesto, abra o app pelo seu próprio endereço https e permita a câmera. Enquanto isso, use o controle remoto Bluetooth ou o botão ⏯.')}render()}
function gOff(){G.on=0;clearInterval(G.h);G.s&&G.s.getTracks().forEach(t=>t.stop());$('#cam').style.display='none';G.wl&&G.wl.release().catch(()=>{});render()}
function gLoop(){const v=$('#cam');if(v.readyState<2)return;const cx=$('#cv').getContext('2d',{willReadFrequently:true});cx.drawImage(v,0,0,32,24);const d=cx.getImageData(0,0,32,24).data,L=new Float32Array(768);
 for(let i=0;i<768;i++)L[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
 if(!G.base){G.base=L;return}
 let ch=0;for(let i=0;i<768;i++)if(Math.abs(L[i]-G.base[i])>S.sens)ch++;const f=ch/768;
 v.style.borderColor=f>.8?'var(--ac)':'var(--ln)';
 if(f<.3){for(let i=0;i<768;i++)G.base[i]+=(L[i]-G.base[i])*.05;G.n=0;if(++G.rel>10)G.arm=1}
 else if(f>.8){G.rel=0;if(++G.n>=5&&G.arm){G.arm=0;G.n=0;beep();tog()}}
 else G.n=Math.max(0,G.n-1)}
const V={on:0,sp:0};
function more(s){const n=Date.now();if(!T||T.t!=='r'){toast('Sem descanso em andamento');return}
 if(T.done||T.end<n){T.end=n+s*1000;T.done=0;T.w=s>10?0:1}else{T.end+=s*1000;if((T.end-(T.p||n))/1000>10)T.w=0}
 T.tot+=s;render();toast('+'+s+' segundos')}
function repeat(){const c=S.cur,i=c&&c.last;if(i==null||!(c.prog[i]||[]).length){toast('Nenhuma série para repetir');return}
 c.prog[i].pop();sel=i;T=null;save();render();say('Repita a série. Avise quando terminar.')}
function cmd(t){t=t.toLowerCase();let m;
 if(m=t.match(/(?:mais|\+)\s*(10|dez|20|vinte|30|trinta)/))more({'10':10,dez:10,'20':20,vinte:20,'30':30,trinta:30}[m[1]]);
 else if(/repet/.test(t))repeat();
 else if(/descans|terminei|s[eé]rie feita|pronto/.test(t))doneSet();
 else if(/pausar|pausa|continuar|retomar/.test(t))tog()}
function vOn(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Este navegador não tem reconhecimento de voz. Use o Chrome.');return}
 const r=V.r=new R();r.lang='pt-BR';r.continuous=true;r.interimResults=false;
 r.onresult=e=>{if(V.sp)return;cmd(e.results[e.results.length-1][0].transcript)};
 r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){V.on=0;alert('O microfone está bloqueado nesta página. Abra o app pelo seu próprio endereço https e permita o microfone.');render()}};
 r.onend=()=>{if(V.on)try{r.start()}catch(x){}};
 try{r.start();V.on=1;toast('Comandos de voz ativos')}catch(e){}render()}
function vOff(){V.on=0;try{V.r.stop()}catch(e){}render()}
function doneSet(){if(view!=='t'||ed)return;const e=DAYS[day].ex[sel];
 if(T&&T.t==='s')return;
 if(T&&T.t==='r'&&!T.done){toast('Descansando: aguarde o aviso');return}
 if(e[6]){T=null;act.timed();return}
 const ld=S.loads[day+':'+sel]||{};add(ld.kg||0,ld.rp||e[3]);toast('Série registrada')}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key;
 if(k.length===1&&'123'.includes(k)){more(+k*10);return}if(k==='r'||k==='R'){repeat();return}
 const a=[' ','Enter','PageDown','ArrowRight','AudioVolumeUp','MediaTrackNext'].includes(k),b=['PageUp','ArrowLeft','AudioVolumeDown','MediaPlayPause','MediaTrackPrevious'].includes(k);
 if(!a&&!b)return;e.preventDefault();document.activeElement&&document.activeElement.blur();a?doneSet():tog()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(G.on){wl();if(G.s.getVideoTracks()[0].readyState!=='live'){gOff();gOn()}}tick()}});
render();requestAnimationFrame(frame);
</script></body></html>
